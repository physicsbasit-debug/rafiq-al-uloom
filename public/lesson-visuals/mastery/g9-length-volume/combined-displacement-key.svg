<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">قياس الإزاحة المركبة في مخبار مدرج</title>
  <desc id="desc">مخباران متماثلان في التدريج، مستوى الماء 40 ملليلتر قبل الغمر و45 ملليلتر بعد غمر كرة فولاذية ومفتاح معدني بالكامل.</desc>

  <rect width="1200" height="675" rx="28" fill="#f7fbff"/>

  <g font-family="Arial, sans-serif" fill="#173a5d" font-weight="700">
    <text x="300" y="64" text-anchor="middle" font-size="31">قبل الغمر</text>
    <text x="900" y="64" text-anchor="middle" font-size="31">بعد الغمر</text>
  </g>

  <!-- Identical cylinder geometry and identical graduated scales -->
  <g id="left-cylinder" transform="translate(100 82)">
    <path d="M125 20H405V510c0 48-30 68-140 68S125 558 125 510Z"
          fill="#ffffff" stroke="#45677f" stroke-width="6"/>

    <!-- Water: bottom of concave meniscus centered exactly at 40 mL -->
    <path d="M145 330
             C205 350 265 350 325 330
             C355 320 375 320 385 325
             L385 510
             C385 538 350 552 265 552
             C180 552 145 538 145 510 Z"
          fill="#9ed9f5"/>
    <path d="M145 330
             C205 350 265 350 325 330
             C355 320 375 320 385 325"
          fill="none" stroke="#2084b8" stroke-width="5"/>

    <!-- 36..46 mL, 1 mL per 40 px; major every 2 mL -->
    <g stroke="#45677f" stroke-width="3">
      <path d="M125 490H188"/><path d="M125 450H165"/>
      <path d="M125 410H188"/><path d="M125 370H165"/>
      <path d="M125 330H188"/><path d="M125 290H165"/>
      <path d="M125 250H188"/><path d="M125 210H165"/>
      <path d="M125 170H188"/><path d="M125 130H165"/>
      <path d="M125 90H188"/>
    </g>

    <g font-family="Arial, sans-serif" font-size="24" fill="#173a5d" text-anchor="end">
      <text x="110" y="498">36</text>
      <text x="110" y="418">38</text>
      <text x="110" y="338">40</text>
      <text x="110" y="258">42</text>
      <text x="110" y="178">44</text>
      <text x="110" y="98">46</text>
    </g>

    <!-- Orange pointer only, no duplicate orange 40 -->
    <path d="M92 330H125" stroke="#d87800" stroke-width="6" stroke-linecap="round"/>
    <text x="265" y="622" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="24" font-weight="700" fill="#173a5d">mL</text>
  </g>

  <g id="right-cylinder" transform="translate(690 82)">
    <path d="M125 20H405V510c0 48-30 68-140 68S125 558 125 510Z"
          fill="#ffffff" stroke="#45677f" stroke-width="6"/>

    <!-- 45 mL meniscus: midway between 44 and 46 -->
    <path d="M145 130
             C205 150 265 150 325 130
             C355 120 375 120 385 125
             L385 510
             C385 538 350 552 265 552
             C180 552 145 538 145 510 Z"
          fill="#9ed9f5"/>
    <path d="M145 130
             C205 150 265 150 325 130
             C355 120 375 120 385 125"
          fill="none" stroke="#2084b8" stroke-width="5"/>

    <!-- Same scale as the left cylinder -->
    <g stroke="#45677f" stroke-width="3">
      <path d="M125 490H188"/><path d="M125 450H165"/>
      <path d="M125 410H188"/><path d="M125 370H165"/>
      <path d="M125 330H188"/><path d="M125 290H165"/>
      <path d="M125 250H188"/><path d="M125 210H165"/>
      <path d="M125 170H188"/><path d="M125 130H165"/>
      <path d="M125 90H188"/>
    </g>

    <g font-family="Arial, sans-serif" font-size="24" fill="#173a5d" text-anchor="end">
      <text x="110" y="498">36</text>
      <text x="110" y="418">38</text>
      <text x="110" y="338">40</text>
      <text x="110" y="258">42</text>
      <text x="110" y="178">44</text>
      <text x="110" y="98">46</text>
    </g>

    <!-- 45 mL marker: one separate callout aligned to the 45 tick -->
    <path d="M92 130H125" stroke="#d87800" stroke-width="6" stroke-linecap="round"/>
    <text x="78" y="139" text-anchor="end" font-family="Arial, sans-serif"
          font-size="25" font-weight="700" fill="#b85d00">45 mL</text>

    <!-- Steel sphere -->
    <circle cx="215" cy="425" r="32" fill="#8f989f" stroke="#59636a" stroke-width="5"/>

    <!-- Full key, kept comfortably above bottom edge -->
    <g transform="translate(255 370)" fill="#c99b55" stroke="#6e542f"
       stroke-width="5" stroke-linejoin="round">
      <circle cx="38" cy="42" r="29"/>
      <circle cx="38" cy="42" r="12" fill="#9ed9f5"/>
      <path d="M60 58L116 112L105 123L93 112L82 123L70 112L59 122L47 110L78 79Z"/>
    </g>

    <text x="265" y="622" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="24" font-weight="700" fill="#173a5d">mL</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f4c81">
    <text x="885" y="650" text-anchor="middle">كرة فولاذية حجمها 3 mL + مفتاح معدني</text>
  </g>
</svg>
